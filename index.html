<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>呼吸道周报 · 本周流行什么</title>
  <meta name="description" content="中国疾控中心呼吸道传染病哨点监测、流感周报、法定传染病月报的通俗版">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0b0d; --panel: #141519; --panel-2: #1b1d22; --hover: rgba(255,255,255,0.035);
      --line: rgba(255,255,255,0.07); --line-2: rgba(255,255,255,0.14);
      --text-1: #eef0f3; --text-2: #a2a7b0; --text-3: #676d77;
      --accent: #fb7185; --grad: linear-gradient(120deg, #fda4af 0%, #fb7185 50%, #f472b6 100%);
      --up: #fb7185; --down: #4ade80; --low: #4ade80; --mid: #fbbf24; --high: #fb7185;
      --shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,0.35);
    }
    :root[data-theme="light"] {
      --bg: #f8f8fa; --panel: #ffffff; --panel-2: #f2f3f6; --hover: rgba(20,20,40,0.035);
      --line: rgba(20,20,40,0.08); --line-2: rgba(20,20,40,0.16);
      --text-1: #17181c; --text-2: #565b66; --text-3: #959aa4;
      --accent: #e11d48; --up: #e11d48; --down: #16a34a; --low: #16a34a; --mid: #d97706; --high: #e11d48;
      --shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(20,20,40,0.06);
    }
    body { background: var(--bg); color: var(--text-1); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1; min-height: 100vh; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(900px 420px at 15% -10%, rgba(251,113,133,0.09), transparent 70%); }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    .topbar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
      background: color-mix(in srgb, var(--bg) 75%, transparent); border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; font-size: 16px; }
    .logo small { font-weight: 500; color: var(--text-3); font-size: 12px; margin-left: 2px; }
    .nav { display: flex; gap: 4px; margin-left: 10px; }
    .nav a { padding: 6px 12px; border-radius: 8px; color: var(--text-2); font-size: 13px; font-weight: 500; white-space: nowrap; }
    .nav a:hover { color: var(--text-1); background: var(--hover); }
    .spacer { flex: 1; }
    .updated { font-size: 12px; color: var(--text-3); white-space: nowrap; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--text-2); flex-shrink: 0; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .layout { max-width: 1200px; margin: 0 auto; padding: 24px 20px 64px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; }
    .aside { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 14px; }
    .panel { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); }
    .pad { padding: 18px 20px; }
    h2.sec { font-size: 17px; font-weight: 700; margin: 34px 0 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; scroll-margin-top: 80px; }
    h2.sec small { color: var(--text-3); font-weight: 500; font-size: 12.5px; }

    .hero { padding: 24px; }
    .hero .wk { font-size: 12.5px; color: var(--text-3); }
    .hero h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; line-height: 1.35; }
    .hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .levels { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .lv { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--panel-2); font-size: 13px; color: var(--text-2); }
    .lv b { color: var(--c); font-weight: 600; }
    .lv::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
    .kpi { padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; }
    .kpi .k { font-size: 12.5px; color: var(--text-2); }
    .kpi .v { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; }
    .kpi .v small { font-size: 15px; font-weight: 500; color: var(--text-2); margin-left: 2px; }
    .kpi .s { font-size: 12px; color: var(--text-3); }
    .up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--text-3); }

    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .bars { padding: 18px 20px; }
    .bars h3 { font-size: 13.5px; font-weight: 600; color: var(--text-2); margin-bottom: 12px; }
    .bar { display: grid; grid-template-columns: 96px minmax(0, 1fr) 82px; gap: 10px; align-items: center; height: 30px; }
    .bar .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .tr { height: 10px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
    .bar .fl { height: 100%; border-radius: 999px; background: var(--accent); opacity: .85; }
    .bar.top .fl { opacity: 1; }
    .bar .v { text-align: right; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .bar .v small { font-weight: 500; margin-left: 4px; font-size: 11.5px; }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2); font-size: 12.5px; white-space: nowrap; }
    .chip:hover { color: var(--text-1); border-color: var(--line-2); }
    .chip.on { background: var(--text-1); color: var(--bg); border-color: var(--text-1); }
    .chart-box { padding: 18px 18px 10px; }
    .chart { position: relative; }
    .chart svg { width: 100%; height: auto; display: block; overflow: visible; }   /* viewBox 按实际宽度生成，文字不变形 */
    .tip { position: absolute; pointer-events: none; background: var(--panel-2); box-shadow: var(--shadow); border-radius: 8px; padding: 6px 10px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -115%); display: none; }
    .note { font-size: 12px; color: var(--text-3); line-height: 1.7; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: left; }
    th { font-size: 12px; color: var(--text-3); font-weight: 600; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    .table-wrap { overflow-x: auto; }
    .rank { display: inline-flex; gap: 6px; flex-wrap: wrap; }
    .rank span { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); }
    .rank span:first-child { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

    .analysis { padding: 18px 20px; font-size: 14px; color: var(--text-2); line-height: 1.8; }
    .tips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .tip-card { padding: 12px 14px; border-radius: 12px; background: var(--panel-2); font-size: 13px; color: var(--text-2); }
    .tip-card b { display: block; color: var(--text-1); margin-bottom: 2px; }

    .smalls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .sm { padding: 14px 16px; min-width: 0; }
    .sm .k { font-size: 13px; font-weight: 600; }
    .sm .v { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .sm .v small { font-size: 12px; color: var(--text-3); font-weight: 500; margin-left: 4px; }
    .sm svg { width: 100%; height: 40px; display: block; margin-top: 6px; }

    .widget { padding: 16px; }
    .widget h3 { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 10px; }
    .mini-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; gap: 8px; }
    .mini-row span:first-child { color: var(--text-2); }
    .ok { color: var(--down); } .bad { color: var(--up); }

    @media (max-width: 980px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .aside { position: static; }
      .topbar-inner { flex-wrap: wrap; row-gap: 6px; }
      .nav { order: 10; width: 100%; margin-left: -8px; overflow-x: auto; scrollbar-width: none; }   /* 手机上导航挪到第二行，可横滑 */
      .nav::-webkit-scrollbar { display: none; }
    }
    @media (max-width: 760px) {
      .topbar-inner { padding: 10px 16px; } .logo small, .updated { display: none; }
      .layout { padding: 16px 16px 50px; } .hero { padding: 18px; } .hero h1 { font-size: 21px; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .v { font-size: 24px; }
      .two, .tips { grid-template-columns: minmax(0, 1fr); }
      .smalls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      th, td { padding: 9px 10px; }
    }
    /* ── 详情抽屉 + 列表页（通用组件 kit：电脑右侧滑出，手机底部升起；地址 #/item/类型/id、#/list/key） ── */
    :root { --kit-bg: var(--bg, #0b0a10); --kit-panel: var(--panel, var(--card, rgba(255,255,255,.04))); --kit-line: var(--line, var(--sep, rgba(255,255,255,.08)));
      --kit-line2: var(--line-2, rgba(255,255,255,.14)); --kit-t1: var(--text-1, #f1eff7); --kit-t2: var(--text-2, #a39fb3); --kit-t3: var(--text-3, #6b677a);
      --kit-accent: var(--accent, #a3e635); --kit-hover: var(--hover, rgba(255,255,255,.05)); }
    .kit-mask { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.38); display: none; }
    .kit-mask.open { display: block; }
    .kit-sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: clamp(440px, 42vw, 620px); max-width: calc(100vw - 24px);
      display: flex; flex-direction: column; overflow: hidden; color: var(--kit-t1); border-radius: 18px;
      background: linear-gradient(var(--kit-panel), var(--kit-panel)), var(--kit-bg); box-shadow: 0 0 0 1px var(--kit-line2), 0 24px 60px rgba(0,0,0,.45);
      animation: kit-in .24s ease-out; }
    @keyframes kit-in { from { transform: translateX(40px); opacity: 0; } }
    .kit-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
      background: rgba(0,0,0,.5); color: #fff; font-size: 15px; display: grid; place-items: center; }
    .kit-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    .kit-cover { aspect-ratio: 16/9; background: var(--kit-hover) center / cover no-repeat; position: relative; }
    .kit-cover.tall { aspect-ratio: auto; height: 280px; background-size: contain; background-color: #000; }
    .kit-cover.ph { display: grid; place-items: center; font-size: 56px; aspect-ratio: 16/6; }
    .kit-head { padding: 18px 20px 4px; display: flex; gap: 14px; align-items: flex-start; }
    .kit-head .kit-thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 14px; background: var(--kit-hover) center / cover no-repeat;
      display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .kit-head .kit-t { flex: 1; min-width: 0; padding-right: 30px; }
    .kit-cover + .kit-head .kit-t { padding-right: 0; }
    .kit-head h2 { font-size: 19px; font-weight: 800; line-height: 1.35; letter-spacing: -0.01em; }
    .kit-sub { color: var(--kit-t2); font-size: 13px; margin-top: 4px; }
    .kit-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .kit-tags span { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--kit-hover); color: var(--kit-t2); }
    .kit-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .kit-big b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-body { padding: 4px 20px 20px; }
    .kit-sec { padding-top: 16px; }
    .kit-sec + .kit-sec { margin-top: 6px; border-top: 1px solid var(--kit-line); }
    .kit-sec h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .kit-sec h4 small { font-size: 12px; color: var(--kit-t3); font-weight: 500; }
    .kit-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .kit-kv div { background: var(--kit-hover); border-radius: 10px; padding: 8px 11px; min-width: 0; }
    .kit-kv small { display: block; font-size: 11px; color: var(--kit-t3); }
    .kit-kv b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .kit-p { font-size: 13.5px; line-height: 1.75; color: var(--kit-t2); white-space: pre-line; }
    .kit-rows { display: flex; flex-direction: column; }
    .kit-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--kit-line); font-size: 13px; text-decoration: none; color: inherit; }
    .kit-row:first-child { border-top: 0; }
    .kit-row[data-kit-go], a.kit-row { cursor: pointer; }
    .kit-row[data-kit-go]:hover .kit-rt, a.kit-row:hover .kit-rt { color: var(--kit-accent); }
    .kit-row .kit-rt { flex: 1; min-width: 0; line-height: 1.45; }
    .kit-row .kit-rm { color: var(--kit-t3); font-size: 12px; white-space: nowrap; }
    .kit-row img, .kit-row .kit-ri { width: 54px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--kit-hover); }
    .kit-acts { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--kit-line); }
    .kit-acts a, .kit-acts button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 12px; border-radius: 11px;
      font: inherit; font-size: 13.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid var(--kit-line2); color: var(--kit-t1); background: transparent; }
    .kit-acts .pri { background: var(--kit-accent); border-color: var(--kit-accent); color: #111; }
    .kit-acts a:hover, .kit-acts button:hover { filter: brightness(1.08); }
    /* 列表页 */
    .kit-lhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .kit-back { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1);
      font-size: 20px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
    .kit-back:hover { background: var(--kit-hover); }
    .kit-lhead h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-lhead small { color: var(--kit-t3); font-size: 12.5px; margin-left: 2px; }
    .kit-lbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .kit-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .kit-chips a, .kit-chips button { padding: 5px 12px; border-radius: 8px; background: var(--kit-hover); color: var(--kit-t2); font: inherit; font-size: 13px;
      font-weight: 600; white-space: nowrap; border: 0; cursor: pointer; text-decoration: none; }
    .kit-chips .on { background: var(--kit-t1); color: var(--kit-bg); }
    .kit-chips small { opacity: .6; margin-left: 4px; font-weight: 500; }
    .kit-sel { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1); font: inherit; font-size: 12.5px; font-weight: 600; }
    .kit-sel option { background: var(--kit-bg); }
    .kit-more { display: block; margin: 16px auto 0; padding: 9px 22px; border-radius: 10px; border: 1px solid var(--kit-line2); background: transparent;
      color: var(--kit-t1); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .kit-more:hover { background: var(--kit-hover); }
    .kit-morelink { font-size: 13px; font-weight: 600; color: var(--kit-t2); text-decoration: none; white-space: nowrap; cursor: pointer; }
    .kit-morelink:hover { color: var(--kit-t1); }
    [data-kit-item] { cursor: pointer; }
    @media (max-width: 760px) {
      .kit-sheet { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: none; height: 86vh; border-radius: 18px 18px 0 0; animation: kit-up .26s ease-out; }
      @keyframes kit-up { from { transform: translateY(30%); opacity: .5; } }
      .kit-head { padding: 16px 16px 4px; } .kit-body { padding: 4px 16px 18px; } .kit-acts { padding: 10px 16px 16px; }
      .kit-cover.tall { height: 220px; }
      .kit-head .kit-thumb { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; }
      .kit-head h2 { font-size: 17.5px; }
      .kit-big b { font-size: 24px; }
      .kit-lhead h2 { font-size: 19px; }
    }

    /* 本站：可点条目的悬停态 */
    tr[data-kit-item]:hover td, .bar[data-kit-item]:hover, .mini-row[data-kit-item]:hover { background: var(--hover); }
    .bar[data-kit-item] { border-radius: 8px; margin: 0 -6px; padding: 0 6px; }
    .kpi[data-kit-item]:hover, .sm[data-kit-item]:hover, .hero[data-kit-item]:hover { box-shadow: 0 0 0 1px var(--line-2); }
    .mini-row[data-kit-item] { border-radius: 6px; }
    h2.sec .kit-morelink { margin-left: auto; }
    td.go { color: var(--text-3); text-align: right; white-space: nowrap; }
    .kit-body .chart svg { margin-top: 2px; }
    .lg { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); margin-bottom: 6px; flex-wrap: wrap; }
    .lg i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--c); vertical-align: middle; margin-right: 5px; }
    .lg i.dash { border-top-style: dashed; }
    .week-row td:first-child { white-space: nowrap; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><div class="logo-mark">🩺</div>呼吸道周报<small>本周流行什么</small></div>
      <nav class="nav"><a href="#rank">病原体</a><a href="#trend">走势</a><a href="#who">谁更易感</a><a href="#tips">健康提示</a><a href="#monthly">每月传染病</a></nav>
      <div class="spacer"></div>
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="refresh" title="重新读取数据"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
      <a class="icon-btn" href="https://github.com/climb0516/health-weekly/actions/workflows/scrape.yml" target="_blank" rel="noopener" title="立即抓取（在 GitHub Actions 点 Run workflow）">⚡</a>
      <button class="icon-btn" id="theme" title="切换主题"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>

  <div class="layout">
    <main id="main"><div class="panel pad muted">加载中…</div></main>
    <aside class="aside" id="aside"></aside>
  </div>

<script>
// ── kit：详情抽屉 + 列表页路由（各站通用，内联在页面里）──
// 用法：
//   KIT.item('news', id => ({ title, sub, cover, thumb, tags:[], big, body:'<div class="kit-sec">…</div>', acts:[{text, href, pri}] }))
//   KIT.list('news', (param, query) => { … 把列表页 HTML 写进容器 … })
//   条目元素加 data-kit-item="news/<id>" 即可点击打开详情；「查看更多」写成 <a href="#/list/news">
//   站点首页渲染函数里先调用 KIT.route() —— 返回 true 表示当前是列表页（已渲染），首页不用再渲染
const KIT = (() => {
  const items = {}, lists = {};
  let mask, homeY = 0, fromHome = 0, lastHash = location.hash, onHome = null, listBox = null;
  const kesc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const parse = h => {
    const m = (h === undefined ? location.hash : h).match(/^#\/(item|list)\/([^?]+?)(?:\?(.*))?$/);
    if (!m) return null;
    const [type, ...rest] = m[2].split('/');
    return { kind: m[1], type: decodeURIComponent(type), id: rest.map(decodeURIComponent).join('/'), q: new URLSearchParams(m[3] || '') };
  };
  function ensure() {
    if (mask) return;
    mask = document.createElement('div');
    mask.className = 'kit-mask';
    mask.innerHTML = '<div class="kit-sheet" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-kit-close]')) close(); });
  }
  function render(d) {
    ensure();
    const cover = d.cover ? `<div class="kit-cover ${d.coverTall ? 'tall' : ''}" style="background-image:url('${kesc(d.cover).replace(/'/g, '%27')}')"></div>`
      : d.coverIcon ? `<div class="kit-cover ph" style="background:${d.coverBg || 'var(--kit-hover)'}">${d.coverIcon}</div>` : '';
    const thumb = !d.cover && !d.coverIcon && (d.thumb || d.thumbIcon)
      ? `<div class="kit-thumb" style="${d.thumb ? `background-image:url('${kesc(d.thumb).replace(/'/g, '%27')}')` : ''}${d.thumbBg ? `;background-color:${d.thumbBg}` : ''}">${d.thumb ? '' : d.thumbIcon}</div>` : '';
    const acts = (d.acts || []).filter(a => a && (a.href || a.onclick));
    mask.firstElementChild.innerHTML = `<button class="kit-x" data-kit-close aria-label="关闭">✕</button>
      <div class="kit-scroll">${cover}
        <div class="kit-head">${thumb}<div class="kit-t"><h2>${kesc(d.title)}</h2>${d.sub ? `<div class="kit-sub">${d.sub}</div>` : ''}
          ${(d.tags || []).filter(Boolean).length ? `<div class="kit-tags">${d.tags.filter(Boolean).join('')}</div>` : ''}${d.big ? `<div class="kit-big">${d.big}</div>` : ''}</div></div>
        <div class="kit-body">${d.body || ''}</div></div>
      ${acts.length ? `<div class="kit-acts">${acts.map((a, i) => a.href
        ? `<a class="${a.pri || (i === 0 && acts.length < 3) ? 'pri' : ''}" href="${kesc(a.href)}" ${a.self ? '' : 'target="_blank" rel="noopener"'}>${a.text}</a>`
        : `<button class="${a.pri ? 'pri' : ''}" data-kit-act="${i}">${a.text}</button>`).join('')}</div>` : ''}`;
    acts.forEach((a, i) => { if (!a.href) { const b = mask.querySelector(`[data-kit-act="${i}"]`); if (b) b.onclick = a.onclick; } });
    mask.querySelector('.kit-scroll').scrollTop = 0;
    mask.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  // 打开详情：写进地址（可分享；浏览器返回 = 关闭）
  function open(key) {
    const target = '#/item/' + key;
    if (location.hash === target) return show(parse(target));
    ensure();
    if (parse()?.kind === 'item') history.replaceState(history.state, '', target);
    else { mask.dataset.base = location.hash; history.pushState({ kit: 1 }, '', target); }
    lastHash = target;
    show(parse(target));
  }
  function show(r) {
    const fn = items[r.type];
    const d = fn && fn(r.id, r.q);
    if (!d) { close(true); return false; }
    render(d);
    return true;
  }
  function close(silent) {
    if (!mask || !mask.classList.contains('open')) return;
    mask.classList.remove('open');
    document.body.style.overflow = '';
    if (!silent && parse()?.kind === 'item') {
      if (history.state && history.state.kit) history.back();          // 从页面里点开的：退回去
      else { history.replaceState(null, '', mask.dataset.base || location.pathname + location.search); lastHash = location.hash; }   // 直接打开的分享链接
    }
  }
  // 当前地址是列表页时渲染列表页并返回 true；首页时返回 false
  function route(box) {
    if (box) listBox = box;
    const r = parse();
    if (r && r.kind === 'list' && lists[r.type]) { lists[r.type](r.id, r.q, listBox); return true; }
    return false;
  }
  // 列表页的公共外壳：返回按钮 + 标题 + 子分类 + 排序
  function shell({ title, note, chips, sort, sortVal, body, more }) {
    return `<div class="kit-lhead"><button class="kit-back" data-kit-back title="返回">‹</button><h2>${kesc(title)}</h2>${note ? `<small>${note}</small>` : ''}</div>
      ${chips || sort ? `<div class="kit-lbar"><div class="kit-chips">${(chips || []).map(c => `<a class="${c.on ? 'on' : ''}" href="${kesc(c.href)}">${kesc(c.text)}${c.count != null ? `<small>${c.count}</small>` : ''}</a>`).join('')}</div>
        ${sort ? `<select class="kit-sel" data-kit-sort>${sort.map(([v, n]) => `<option value="${kesc(v)}" ${v === sortVal ? 'selected' : ''}>${kesc(n)}</option>`).join('')}</select>` : ''}</div>` : ''}
      ${body}${more ? `<button class="kit-more" data-kit-more>${more}</button>` : ''}`;
  }
  function init(home) {
    onHome = home;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-kit-item],[data-kit-go],[data-kit-back]');
      if (!t) return;
      const inner = e.target.closest('a[href],button,input,select,label,summary');   // 卡片里的其它按钮 / 链接（关注、复制…）优先
      if (inner && inner !== t && t.contains(inner)) return;
      e.preventDefault();
      if (t.dataset.kitBack !== undefined) { fromHome && history.length > fromHome ? history.go(-fromHome) : (location.hash = ''); return; }
      open(t.dataset.kitItem || t.dataset.kitGo);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    window.addEventListener('hashchange', () => {
      const r = parse();
      let was = parse(lastHash), steps = 1;
      if (was && was.kind === 'item') {                                 // 从详情离开
        const base = mask && mask.dataset.base !== undefined ? mask.dataset.base : '';
        if (location.hash === base) { lastHash = location.hash; close(true); return; }   // 只是关掉详情，底下页面不动
        was = parse(base); steps = 2;                                   // 在详情里点了别的列表：按详情底下那页算，返回要退两步
      }
      lastHash = location.hash;
      if (r && r.kind === 'item') { show(r); return; }
      close(true);
      const wasHome = !was;
      if (r && r.kind === 'list') {
        if (wasHome) { homeY = scrollY; fromHome = steps; }
        onHome && onHome();
        if (wasHome || was.type !== r.type) scrollTo(0, 0);
      } else {
        onHome && onHome();
        if (fromHome) { scrollTo(0, homeY); fromHome = 0; }
      }
    });
    // 直接打开带 #/item/ 的链接（比如大屏跳过来）：页面数据读完后由站点调用 KIT.boot()
  }
  function boot() { const r = parse(); if (r && r.kind === 'item') show(r); }
  return { item: (t, fn) => (items[t] = fn), list: (t, fn) => (lists[t] = fn), open, close, route, shell, init, boot, parse, esc: kesc,
    // 小工具：详情里的键值格、段落、关联列表
    kv: rows => { const r = rows.filter(x => x && x[1] != null && x[1] !== ''); return r.length ? `<div class="kit-kv">${r.map(([k, v]) => `<div><small>${kesc(k)}</small><b title="${kesc(v)}">${kesc(v)}</b></div>`).join('')}</div>` : ''; },
    sec: (title, html, note) => html ? `<div class="kit-sec"><h4>${title}${note ? `<small>${note}</small>` : ''}</h4>${html}</div>` : '',
    p: t => t ? `<p class="kit-p">${kesc(t)}</p>` : '',
  };
})();

// ── 折线图：viewBox 按容器实际像素宽度生成（不拉伸，文字不变形），缺数据处断开 ──
// series: [{ name, vals, color, dash }]；labels：提示框文字；ticks：横轴短标签
const CHS = {};
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw / 4)));
  return [1, 2, 5, 10].map(k => k * p).find(s => raw / s <= 5) || 10 * p;
}
function lineChart(id, labels, ticks, series, { W = 600, H = 240, unit = '%' } = {}) {
  const vals = series.flatMap(s => s.vals).filter(v => v != null);
  if (!vals.length) return '<div class="note" style="padding:40px 0;text-align:center">暂无数据</div>';
  W = Math.max(260, Math.round(W));
  const n = labels.length, fmt = unit === '%' ? v => v + '%' : v => fmtN(v);
  const L = 8, R = unit === '%' ? 40 : 54, T = 12, B = 24;
  const raw = Math.max(...vals) * 1.1 || 1, stepV = niceStep(raw), max = Math.ceil(raw / stepV) * stepV;
  const x = i => L + (n > 1 ? i / (n - 1) : 0.5) * (W - L - R), y = v => T + (1 - v / max) * (H - T - B);
  const grid = Array.from({ length: Math.round(max / stepV) + 1 }, (_, k) => k * stepV).map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W - R + 6}" y="${y(v) + 4}" font-size="11" fill="var(--text-3)">${fmt(+v.toPrecision(6))}</text>`).join('');
  const every = Math.ceil(n / Math.max(2, Math.floor((W - L - R) / 86)));   // 横轴每 86px 左右一个标签
  const tk = ticks.map((t, i) => (n - 1 - i) % every === 0 ? `<text x="${x(i)}" y="${H - 6}" font-size="11" fill="var(--text-3)" text-anchor="middle">${esc(t)}</text>` : '').join('');
  const lines = series.map(s => {
    let d = '', pen = false;
    s.vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    const dots = s.dash ? '' : s.vals.map((v, i) => v != null ? `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === n - 1 ? 4 : n > 40 ? 1.8 : 2.5}" fill="${s.color}"/>` : '').join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>${dots}`;
  }).join('');
  CHS[id] = { labels, series, x, y, W, H, n, fmt };
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}">${grid}${tk}${lines}
    <line class="cross" y1="${T}" y2="${H - B}" stroke="var(--line-2)" visibility="hidden"/></svg><div class="tip"></div></div>`;
}
const legend = series => series.length > 1 ? `<div class="lg">${series.map(s => `<span><i class="${s.dash ? 'dash' : ''}" style="--c:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
// 提示框：鼠标和触屏都支持，事件委托（首页和抽屉里的图通用）
let tipBox = null;
function chartMove(e) {
  const box = e.target.closest?.('.chart[data-chart]');
  if (tipBox && tipBox !== box) { tipBox.querySelector('.tip').style.display = 'none'; tipBox.querySelector('.cross')?.setAttribute('visibility', 'hidden'); tipBox = null; }
  const c = box && CHS[box.dataset.chart], svg = box?.querySelector('svg');
  if (!c || !svg) return;
  tipBox = box;
  const r = svg.getBoundingClientRect(), pt = e.touches ? e.touches[0] : e, cx = (pt.clientX - r.left) / r.width * c.W;
  let bi = 0; for (let i = 1; i < c.n; i++) if (Math.abs(c.x(i) - cx) < Math.abs(c.x(bi) - cx)) bi = i;
  const tip = box.querySelector('.tip'), v0 = c.series.map(s => s.vals[bi]).find(v => v != null);
  tip.innerHTML = `${esc(c.labels[bi])}<br>${c.series.map(s => `${c.series.length > 1 ? esc(s.name) + ' ' : ''}<b>${s.vals[bi] == null ? '未公布' : c.fmt(s.vals[bi])}</b>`).join(' · ')}`;
  tip.style.display = 'block';
  tip.style.left = Math.min(r.width - 70, Math.max(70, c.x(bi) / c.W * r.width)) + 'px';
  tip.style.top = ((v0 == null ? c.H / 2 : c.y(v0)) / c.H * r.height) + 'px';
  const cr = box.querySelector('.cross'); cr.setAttribute('x1', c.x(bi)); cr.setAttribute('x2', c.x(bi)); cr.setAttribute('visibility', 'visible');
}

  const max = Math.max(...nums) || 1, W = 200, H = 40;
  const line = v.map((x, i) => x == null ? '' : `${i && v[i - 1] != null ? 'L' : 'M'}${(i / (v.length - 1) * W).toFixed(1)},${(H - 3 - x / max * (H - 6)).toFixed(1)}`).join('');
  const chg = prevM ? (cur / prevM - 1) * 100 : null;

      + KIT.sec(`近 ${ms.length} 个月发病数`, lineChart('d-cases', labels, ticks, [{ name: '发病', vals: cases, color: 'var(--accent)' }], { W: drawerW(), H: 200, unit: '例' }), '例')
      + (deaths.some(v => v > 0) ? KIT.sec(`近 ${ms.length} 个月死亡数`, lineChart('d-deaths', labels, ticks, [{ name: '死亡', vals: deaths, color: 'var(--mid)' }], { W: drawerW(), H: 160, unit: '人' }), '人') : '')
      + KIT.sec('最近 12 个月', `<div class="table-wrap"><table><tr><th>月份</th><th class="num">发病</th><th class="num">死亡</th><th class="num">环比</th></tr>
          ${D.months.slice(0, 12).map((m, i) => { const v = m.diseases[name], p = D.months[i + 1]?.diseases[name]; return v ? `<tr><td>${m.month}</td><td class="num">${v[0].toLocaleString()}</td><td class="num">${v[1].toLocaleString()}</td>${chgCell(p?.[0] ? (v[0] / p[0] - 1) * 100 : null)}</tr>` : ''; }).join('')}</table></div>`),
    acts: [{ text: '本月原文 ↗', href: m0.url }] };
});

// ── 列表页 ──
const LPAGE = 30;
let listN = LPAGE, listKey = '';
const moreBtn = (n) => n > listN ? `加载更多（${listN} / ${n}）` : '';
const DSORT = [['cases', '按发病数'], ['deaths', '按死亡数'], ['chg', '按环比'], ['name', '按名称']];
KIT.list('diseases', (_, q, box) => {
  const sort = q.get('sort') || 'cases', m = D.months[0];
  const cmp = { cases: (a, b) => b[1] - a[1], deaths: (a, b) => b[2] - a[2] || b[1] - a[1], chg: (a, b) => (b[3] ?? -1e9) - (a[3] ?? -1e9), name: (a, b) => a[0].localeCompare(b[0], 'zh') }[sort] || ((a, b) => b[1] - a[1]);
  const rows = diseaseRows(true).sort(cmp);
  box.innerHTML = KIT.shell({ title: '每月法定传染病', note: `${m.month.replace('-', ' 年 ')} 月 · ${rows.length} 种 · 全国共报告 ${fmtN(m.total)} 例`,
    sort: DSORT, sortVal: sort,
    body: `<div class="panel"><div class="table-wrap"><table><tr><th>#</th><th>病种</th><th class="num">发病</th><th class="num">死亡</th><th class="num">环比</th><th></th></tr>
      ${rows.slice(0, listN).map((r, i) => disTr(r, i)).join('')}</table></div></div>
      <p class="note" style="margin-top:12px">发病数为 0 的病种也列出；病毒性肝炎下的甲、乙、丙、丁、戊型和未分型肝炎是子类。<a href="${esc(m.url)}" target="_blank" rel="noopener">查看原文 ↗</a></p>`,
    more: moreBtn(rows.length) });
});
KIT.list('weeks', (_, q, box) => {
  const yr = q.get('year') || 'all', years = [...new Set(D.weeks.map(w => String(w.year)))];
  const all = D.weeks.filter(w => yr === 'all' || String(w.year) === yr);
  box.innerHTML = KIT.shell({ title: '往期周报', note: `呼吸道传染病哨点监测 · ${all.length} 期`,
    chips: [['all', '全部'], ...years.map(y => [y, y + ' 年'])].map(([k, n]) => ({ text: n, href: '#/list/weeks' + (k === 'all' ? '' : '?year=' + k), on: k === yr, count: D.weeks.filter(w => k === 'all' || String(w.year) === k).length })),
    body: `<div class="panel"><div class="table-wrap"><table><tr><th>周次</th><th>日期</th><th class="num">ILI</th><th>门诊头号病原体</th><th>南方 / 北方</th><th></th></tr>
      ${all.slice(0, listN).map(w => { const t = Object.entries(w.outpatient).sort((a, b) => b[1].rate - a[1].rate)[0];
        return `<tr data-kit-item="week/${wid(w)}" class="week-row"><td>${weekTick(w)}</td><td class="muted">${w.period ? `${md(w.period[0])}–${md(w.period[1])}` : ''}</td><td class="num">${w.ili != null ? w.ili + '%' : '—'}</td>
          <td>${t ? `${esc(short(t[0]))} ${t[1].rate}%` : '—'}</td><td class="muted">${esc((w.level?.south || '—').replace('流行水平', ''))} / ${esc((w.level?.north || '—').replace('流行水平', ''))}</td><td class="go">详情 ›</td></tr>`; }).join('')}</table></div></div>`,
    more: moreBtn(all.length) });
});
KIT.list('flu', (_, q, box) => {
  const fl = D.flus || (D.flu ? [D.flu] : []);
  box.innerHTML = KIT.shell({ title: '中国流感监测周报', note: `国家流感中心 · 最近 ${fl.length} 期`,
    body: `<div class="panel"><div class="table-wrap"><table><tr><th>期次</th><th>截至</th><th class="num">甲 / 乙型</th><th class="num">暴发</th><th></th></tr>
      ${fl.slice(0, listN).map(f => `<tr data-kit-item="flu/${fid(f)}"><td>${esc(f.title.replace('中国流感监测周报', ''))}</td><td class="muted">${f.until ? md(f.until) : ''}</td>
        <td class="num">${f.a_pct != null ? `${f.a_pct}% / ${f.b_pct}%` : '—'}</td><td class="num">${f.outbreaks ?? '—'}</td><td class="go">详情 ›</td></tr>`).join('')}</table></div></div>`,
    more: moreBtn(fl.length) });
});
document.addEventListener('click', e => { if (e.target.closest('[data-kit-more]')) { listN += LPAGE; render(); } });
document.addEventListener('change', e => {
  if (!e.target.matches('[data-kit-sort]')) return;
  const r = KIT.parse(); r.q.set('sort', e.target.value);
  location.hash = `#/list/${r.type}?${r.q}`;
});
// 地址变化：换了列表才重置分页；列表页里点顶部导航回首页后滚到锚点
let wantAnchor = false;
document.addEventListener('click', e => { if (e.target.closest('.nav a') && KIT.parse()) wantAnchor = true; });
window.addEventListener('hashchange', () => {
  const r = KIT.parse();
  if (r?.kind === 'item') return;
  const page = r?.kind === 'list' ? location.hash : '';
  if (page && page !== listKey) { listN = LPAGE; listKey = page; }
  setTimeout(() => {
    if (wantAnchor && !r) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    wantAnchor = false;
  });
}, true);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-trend]');
  if (!t) return;
  state.trend = t.dataset.trend; store.set('trend', state.trend);
  document.querySelectorAll('[data-trend]').forEach(b => b.classList.toggle('on', b === t));
  $('#chart').innerHTML = trendSVG();
});
function applyTheme(t) { document.documentElement.dataset.theme = t; }
applyTheme(store.get('theme', 'dark'));
$('#theme').addEventListener('click', () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(t); store.set('theme', t); });

async function load() {
  $('#refresh').classList.add('spin');
  try {
    D = await fetch('data.json', { cache: 'no-cache' }).then(r => r.json());   // no-cache：更新后刷新即可见
    render();
    KIT.boot();
  } catch (e) {
    if (!D) $('#main').innerHTML = '<div class="panel pad">数据加载失败，请稍后刷新</div>';
  } finally { $('#refresh').classList.remove('spin'); }
}
$('#refresh').addEventListener('click', load);
KIT.init(render);
load();
</script>
</body>
</html>
